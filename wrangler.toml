name = "tuktakmovie"
main = "src/worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./public"

[[d1_databases]]
binding = "DB"
database_name = "tuktakmovies-db"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tuktakmovies-media"

[vars]
SITE_URL = "https://tuktakmovie.redrs.workers.dev"
SITE_NAME = "TuktakMovie"

# Secrets (set via: wrangler secret put SECRET_NAME)
# TMDB_API_KEY
# JWT_SECRET
# ADMIN_EMAIL
# ADMIN_PASSWORD_HASH
# YOUTUBE_API_KEY (optional)

[env.production]
name = "tuktakmovie-production"
route = { pattern = "tuktakmovie.redrs.workers.dev/*", zone_name = "tuktakmovie.redrs.workers.dev" }

[env.preview]
name = "tuktakmovie-preview"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]
